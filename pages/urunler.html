    <nav class="navbar">

        <ul>

    <main class="content">
        <h2 style="text-align: center; margin-bottom: 30px;">Tüm Ürünlerimiz</h2>
        <div class="urun-listesi">
            <div class="urun-kart"><img src="../img/telefon.jpg" alt="Telefon"><h3>Akıllı Telefon</h3><p>100000 TL</p><button onclick="sepeteEkle('Akıllı Telefon', 100000)">Sepete Ekle</button></div>
            <div class="urun-kart"><img src="../img/laptop.jpg" alt="Laptop"><h3>Dizüstü Bilgisayar</h3><p>50000 TL</p><button onclick="sepeteEkle('Dizüstü Bilgisayar', 50000)">Sepete Ekle</button></div>
            <div class="urun-kart"><img src="../img/kulaklik.avif" alt="Kulaklık"><h3>Kablosuz Kulaklık</h3><p>2000 TL</p><button onclick="sepeteEkle('Kablosuz Kulaklık', 2000)">Sepete Ekle</button></div>
            <div class="urun-kart"><img src="../img/tablet.jpg" alt="Tablet"><h3>Tablet</h3><p>8500 TL</p><button onclick="sepeteEkle('Tablet', 8500)">Sepete Ekle</button></div>
            <div class="urun-kart"><img src="../img/akillisaat.webp" alt="Saat"><h3>Akıllı Saat</h3><p>3500 TL</p><button onclick="sepeteEkle('Akıllı Saat', 3500)">Sepete Ekle</button></div>
            <div class="urun-kart"><img src="../img/mouse.jpg" alt="Mouse"><h3>Mouse</h3><p>1200 TL</p><button onclick="sepeteEkle('Mouse', 1200)">Sepete Ekle</button></div>
            <div class="urun-kart"><img src="../img/hoparlor.jpg" alt="Hoparlör"><h3>Bluetooth Hoparlör</h3><p>1800 TL</p><button onclick="sepeteEkle('Bluetooth Hoparlör', 1800)">Sepete Ekle</button></div>
            <div class="urun-kart"><img src="../img/bilgisayarçantasi.jpg" alt="Bilgisayar Çantası"><h3>Bilgisayar Çantası</h3><p>950 TL</p><button onclick="sepeteEkle('Bilgisayar Çantası', 950)">Sepete Ekle</button></div>
        </div>
    </main>
